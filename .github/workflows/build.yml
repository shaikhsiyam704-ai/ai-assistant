name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade buildozer cython
        sudo apt-get update
        sudo apt-get install -y build-essential git python3-dev ffmpeg libsdl2-dev libssl-dev zip unzip openjdk-17-jdk

    - name: Initialize Buildozer and Build APK
      run: |
        buildozer init
        sed -i 's/requirements = .*/requirements = python3,kivy,gTTS,speechrecognition,requests/' buildozer.spec
        yes | buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v3
      with:
        name: boss-assistant-apk
        path: bin/*.apk
